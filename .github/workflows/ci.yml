name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Format, lint, type check, manifest check and tests all run on Bun
  # (bun run ci). Bun floats on 1.x on purpose so a Bun regression surfaces
  # early. The publish dry run goes through the jsr CLI (a devDependency that
  # bundles its own publisher), so no Deno is installed anywhere in CI.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run CI checks
        run: bun run ci
      - name: Publish dry run
        run: bun run publish:dry
